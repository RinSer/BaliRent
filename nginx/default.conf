upstream fileserver {
    server fileserver:1234;
}

upstream backend {
    server api:1234;
}

index index.html;

server {
    listen 80;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    location / {
        root /srv/static;
    }

    location /files {
        proxy_pass http://fileserver;
    }

    location /api {
        proxy_pass http://backend;
    }
}