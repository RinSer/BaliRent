version: '3.8'

services:
  nginx:
    image: nginx:latest
    ports: 
      - 8080:80
    volumes:
      - ./nginx:/etc/nginx/conf.d/
      - ./ui/build:/srv/static
      - ./nginxlogs:/var/log/nginx
    depends_on:
      - api
      - fileserver
  #dev mail server       
  mail:
    image: namshi/smtp:latest
    ports:
      - '25:25'
      - '587:587'
    environment:
      - 'SMTP_USER=smtp_user'
      - 'SMTP_PASSWORD=smtp_password'
      - 'SMTP_HOSTNAME=rent'
      - 'SMTP_FROM_ADDRESS=admin@bali-rent.com'

  redis:
    image: redis:latest
    container_name: redis
    restart: always
    ports:
      - "6379:6379"

  db:
    image: postgres:latest
    restart: always
    ports:
      - 5432:5432
    environment:
      POSTGRES_PASSWORD: admin

  fileserver:
    build:
      context: .
      dockerfile: fileserver.Dockerfile
    restart: on-failure:10
    environment:
      - PORT=1234
      - FILES_DIR=/srv/images
      - JWT_SECRET=secret-new
    volumes:
      - ./images:/srv/images

  api:
    build:
      context: .
      dockerfile: api.Dockerfile
    restart: on-failure:10
    environment:
      - PORT=1234
      - DATABASE_URL=db
      - JWT_SECRET=secret-new
      - MAIL_SERVER=mail
      - REDIS_URL=redis
    depends_on:
      - db
      - mail
      - redis