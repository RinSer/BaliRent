version: '3.8'

services:
  nginx:
    image: nginx:latest
    restart: always
    ports: 
      - 8080:80
    volumes:
      - ./nginx:/etc/nginx/conf.d/
      - ./ui/build:/srv/static
      - ./nginxlogs:/var/log/nginx
    depends_on:
      - api
      - fileserver
    
