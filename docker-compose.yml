  mail:
    image: mailhog/mailhog
    restart: always
    ports:
      - "1025:1025"
      - "8025:8025"

  redis:
    image: redis:latest
    container_name: redis
    restart: always
    ports:
      - "6379:6379"

  db:
    image: postgres:latest
    restart: always
    ports:
      - 5432:5432
    environment:
      POSTGRES_PASSWORD: admin

  fileserver:
    build:
      context: .
      dockerfile: fileserver.Dockerfile
    restart: on-failure:10
    environment:
      - PORT=1234
      - FILES_DIR=/srv/images
      - JWT_SECRET=secret-new
    volumes:
      - ./images:/srv/images

  api:
    build:
      context: .
      dockerfile: api.Dockerfile
    restart: on-failure:10
    environment:
      - PORT=1234
      - DATABASE_URL=db
      - JWT_SECRET=secret-new
      - MAIL_SERVER=mail
      - MAIL_FROM=admin@bali-rent.com
      - MAIL_PASSWORD=smtp_password
      - REDIS_URL=redis
    depends_on:
      - db
      - mail
      - redis