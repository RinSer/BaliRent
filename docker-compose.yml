version: '3.8'

services:
  db:
    image: postgres
    restart: always
    ports:
      - 5432:5432
    environment:
      POSTGRES_PASSWORD: admin

  fileserver:
    build:
      context: .
      dockerfile: fileserver.Dockerfile
    ports:
      - 4321:1234
    restart: on-failure:10
    environment:
      - PORT=1234
      - FILES_DIR=/srv/images
      - JWT_SECRET=secret-new
    volumes:
      - ./images:/srv/images

  api:
    build:
      context: .
      dockerfile: api.Dockerfile
    ports:
      - 8080:1234
    restart: on-failure:10
    environment:
      - PORT=1234
      - DATABASE_URL=db
      - JWT_SECRET=secret-new
    depends_on:
      - db
