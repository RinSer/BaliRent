version: '3.8'

services:
  nginx:
    image: nginx:latest
    ports: 
      - 8080:80
    volumes:
      - ./nginx:/etc/nginx/conf.d/
      - ./static:/srv/static
      - ./nginxlogs:/var/log/nginx
    depends_on:
      - api
      - fileserver
  
  db:
    image: postgres:latest
    restart: always
    ports:
      - 5432:5432
    environment:
      POSTGRES_PASSWORD: admin

  fileserver:
    build:
      context: .
      dockerfile: fileserver.Dockerfile
    restart: on-failure:10
    environment:
      - PORT=1234
      - FILES_DIR=/srv/images
      - JWT_SECRET=secret-new
    volumes:
      - ./images:/srv/images

  api:
    build:
      context: .
      dockerfile: api.Dockerfile
    restart: on-failure:10
    environment:
      - PORT=1234
      - DATABASE_URL=db
      - JWT_SECRET=secret-new
    depends_on:
      - db